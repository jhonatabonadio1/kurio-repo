<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kurio — marketplace de NFTs selecionados de criadores emergentes e consagrados." />
    <meta name="theme-color" content="#140D0A" />
    <title>Kurio — Marketplace de NFTs</title>
    <script>
      // Home LCP: the hero artwork (desktop) / the first catalog card (mobile).
      // Preloaded only on the home page, with the same srcset/sizes as the <img>.
      if (location.pathname === '/') {
        var set = '/nft/emerald-ape-320.webp 320w, /nft/emerald-ape-640.webp 640w, /nft/emerald-ape-960.webp 960w'
        ;[
          ['(min-width: 768px)', '(min-width: 1024px) 450px, 40vw'],
          ['(max-width: 767px)', '45vw'],
        ].forEach(function (p) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.setAttribute('imagesrcset', set)
          l.setAttribute('imagesizes', p[1])
          l.media = p[0]
          l.setAttribute('fetchpriority', 'high')
          document.head.appendChild(l)
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
